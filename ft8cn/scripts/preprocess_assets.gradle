// Script to pre-process JSON assets to SQLite databases
// This reduces APK size and improves app startup time

import groovy.json.JsonSlurper
import java.sql.Connection
import java.sql.DriverManager
import java.sql.Statement

task preprocessAssets {
    description = 'Pre-process JSON files to SQLite databases for faster loading'
    group = 'build'
    
    doLast {
        def assetsDir = file("${projectDir}/app/src/main/assets")
        def outputDir = file("${projectDir}/app/src/main/assets")
        
        println "Starting asset preprocessing..."
        
        // Process ITU zone JSON
        if (file("${assetsDir}/ituzone.json").exists()) {
            println "Processing ituzone.json..."
            def sqliteFile = new File(outputDir, "ituzone.db")
            processItuZoneJson("${assetsDir}/ituzone.json", sqliteFile.absolutePath)
            println "Created: ${sqliteFile.name} (${sqliteFile.length() / 1024} KB)"
        }
        
        // Process CQ zone JSON
        if (file("${assetsDir}/cqzone.json").exists()) {
            println "Processing cqzone.json..."
            def sqliteFile = new File(outputDir, "cqzone.db")
            processCqZoneJson("${assetsDir}/cqzone.json", sqliteFile.absolutePath)
            println "Created: ${sqliteFile.name} (${sqliteFile.length() / 1024} KB)"
        }
        
        // Process DXCC JSON
        if (file("${assetsDir}/dxcc_list.json").exists()) {
            println "Processing dxcc_list.json..."
            def sqliteFile = new File(outputDir, "dxcc_list.db")
            processDxccJson("${assetsDir}/dxcc_list.json", sqliteFile.absolutePath)
            println "Created: ${sqliteFile.name} (${sqliteFile.length() / 1024} KB)"
        }
        
        println "Asset preprocessing complete!"
    }
}

def processItuZoneJson(String jsonPath, String dbPath) {
    def jsonFile = new File(jsonPath)
    def json = new JsonSlurper().parse(jsonFile)
    
    // Delete existing database
    def dbFile = new File(dbPath)
    if (dbFile.exists()) {
        dbFile.delete()
    }
    
    // Create SQLite database
    Class.forName("org.sqlite.JDBC")
    def connection = DriverManager.getConnection("jdbc:sqlite:${dbPath}")
    def statement = connection.createStatement()
    
    try {
        // Create table
        statement.execute("""
            CREATE TABLE ituList (
                itu TEXT,
                grid TEXT
            )
        """)
        
        // Insert data
        def insertStmt = connection.prepareStatement("INSERT INTO ituList (itu, grid) VALUES (?, ?)")
        
        json.each { key, value ->
            def itu = key.toString()
            def mhArray = value.mh
            if (mhArray) {
                mhArray.each { grid ->
                    insertStmt.setString(1, itu)
                    insertStmt.setString(2, grid.toString())
                    insertStmt.executeUpdate()
                }
            }
        }
        
        insertStmt.close()
        connection.commit()
    } finally {
        statement.close()
        connection.close()
    }
}

